<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Coordenadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">Coordenadores</h1>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Salário</th>
                <th>Data de Admissão</th>
                <th>Status</th>
                <th>Carga Horária</th>
                <th>Departamento</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="coord : ${coordenadores}">
                <td th:text="${coord.nome}"></td>
                <td th:text="${coord.email}"></td>
                <td th:text="${coord.salario}"></td>
                <td th:text="${coord.dataAdmissao}"></td>
                <td th:text="${coord.status}"></td>
                <td th:text="${coord.cargaHoraria}"></td>
                <!-- Aqui aparece o nome do departamento -->
                <td th:text="${coord.departamento.nome}"></td>
                <td>
                    <a th:href="@{'/editarcoordenador/' + ${coord.id}}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{'/removercoordenador/' + ${coord.id}}" class="btn btn-sm btn-danger">Remover</a>
                </td>
            </tr>
        </tbody>
    </table>

    <a href="/salvarcoordenador" class="btn btn-primary">Novo Coordenador</a>
</div>
</body>
</html>
