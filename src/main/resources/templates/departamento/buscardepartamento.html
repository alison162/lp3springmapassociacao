<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layoutprincipal.html}">

<head>
    <title>Lista de Departamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class=" container" layout:fragment="conteudoprincipal">
        <div class="p-4 p-md-5 mt-4 mb-4 rounded text-body-emphasis" style="background-color: #E9F1FA;">
            <div class="col-lg-6 px-0">
                <h1 class="display-4 fst-italic">Manter Departamento</h1>
            </div>
        </div>
        <table class="table table-striped table-hover">
            <thead class="table">
                <tr>
                    <th>Nome</th>
                    <th>Coordenador Responsável</th>
                    <th>Gerente Responsável</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="dep : ${departamentos}">
                    <td th:text="${dep.nome}"></td>
                    <td>
                        <span th:each="coord : ${dep.coordenador}" th:text="${coord.nome + ' '}">
                        </span>
                    </td>
                    <td>
                        <span th:each="gerente : ${dep.gerente}" th:text="${gerente.nome + ' '}">
                        </span>
                    </td>
                    <td>
                        <form th:action="@{/editardepartamento/{id}(id=${dep.idDepartamento})}" method="get"
                            onsubmit="return confirm('Deseja realmente editar este departamento?');">
                            <button type="submit" class="btn btn-warning">Editar</button>
                        </form>
                    </td>
                    <td>
                        <form th:action="@{/removerdepartamento/{id}(id=${dep.idDepartamento})}" method="get"
                            onsubmit="return confirm('Deseja realmente remover este departamento?');">
                            <button type="submit" class="btn btn-danger">Remover</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</body>

</html>
