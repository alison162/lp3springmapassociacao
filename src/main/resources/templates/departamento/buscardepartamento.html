<!doctype html>
<html
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layoutprincipal.html}"
>
  <head>
    <title>Lista de Departamentos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container" layout:fragment="conteudoprincipal">
      <div
        class="p-4 p-md-5 mt-4 mb-4 rounded text-body-emphasis"
        style="background-color: #e9f1fa"
      >
        <div class="col-lg-6 px-0">
          <h1 class="display-4 fst-italic">Manter Departamento</h1>
        </div>
      </div>
      <table class="table table-striped table-hover">
        <thead class="table">
          <tr>
            <th>Nome</th>
            <th>Coordenador Responsável</th>
            <th>Gerente Responsável</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="dep : ${departamentos}">
            <td th:text="${dep.nome}"></td>
            <td>
              <span
                th:each="coord : ${dep.coordenador}"
                th:text="${coord.nome + ' '}"
              >
              </span>
            </td>
            <td>
              <span
                th:each="gerente : ${dep.gerente}"
                th:text="${gerente.nome + ' '}"
              >
              </span>
            </td>
            <td>
              <form
                th:action="@{/editardepartamento/{id}(id=${dep.idDepartamento})}"
                method="get"
                onsubmit="
                  return confirm('Deseja realmente editar este departamento?');
                "
              >
                <button type="submit" class="btn btn-warning">Editar</button>
              </form>
            </td>
            <td>
              <form
                th:action="@{/removerdepartamento/{id}(id=${dep.idDepartamento})}"
                method="get"
                onsubmit="
                  return confirm('Deseja realmente remover este departamento?');
                "
              >
                <button type="submit" class="btn btn-danger">Remover</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="modal fade" id="modalErro" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header bg-danger text-white">
              <h5 class="modal-title">Erro de Exclusão</h5>

              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body">
              <span th:text="${erro}"></span>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Ok
              </button>
            </div>
          </div>
        </div>
      </div>

      <script th:if="${erro}">
        window.onload = function () {
          let modal = new bootstrap.Modal(document.getElementById("modalErro"));

          modal.show();
        };
      </script>

      <div
        class="modal fade"
        id="modalSucesso"
        tabindex="-1"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header bg-success text-white">
              <h5 class="modal-title">Tudo Certo!</h5>

              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body">
              <span th:text="${sucesso}"></span>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Ok
              </button>
            </div>
          </div>
        </div>
      </div>

      <script th:if="${sucesso}">
        window.onload = function () {
          let modal = new bootstrap.Modal(
            document.getElementById("modalSucesso"),
          );

          modal.show();
        };
      </script>
    </div>
  </body>
</html>
