<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layoutprincipal.html}">

<head>
    <title>Salvar Coordenador</title>
</head>

<body>
    <div class=" container" layout:fragment="conteudoprincipal">
        <div class="p-4 p-md-5 mt-4 mb-4 rounded text-body-emphasis" style="background-color: #E9F1FA;">
            <div class="col-lg-6 px-0">
                <h1 class="display-4 fst-italic">Salvar Coordenador</h1>
                <p class="lead my-3">Preencha os dados do Coordenador.</p>
                <p class="lead mb-0"><a href="#" class="text-body-emphasis fw-bold">Continue reading...</a></p>
            </div>
        </div>

        <form action="/salvarcoordenador" method="post" th:object="${coordenador}">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" th:field="*{nome}">
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" th:field="*{email}">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="salario" class="form-label">Salário</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{salario}">
                </div>
                <div class="col-md-4">
                    <label for="dataAdmissao" class="form-label">Data de Admissão</label>
                    <input type="date" class="form-control" th:field="*{dataAdmissao}">
                </div>
                <div class="col-md-4">
                    <label for="status" class="form-label">Status</label>
                    <select id="status" class="form-select" th:field="*{status}">
                        <option value="Ativo">Ativo</option>
                        <option value="Inativo">Inativo</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="cargaHoraria" class="form-label">Carga Horária</label>
                    <input type="number" class="form-control" th:field="*{cargaHoraria}">
                </div>
                <div class="col-md-8">
                    <label for="observacoes" class="form-label">Observações</label>
                    <textarea class="form-control" th:field="*{observacoes}"></textarea>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-12">
                    <label for="departamento" class="form-label">Departamento</label>
                    <select id="departamento" class="form-select" th:field="*{departamento}">
                        <option th:each="dep : ${departamentos}" th:value="${dep}" th:text="${dep.nome}"></option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Salvar</button>
        </form>
    </div>
    </div>
</body>

</html>
