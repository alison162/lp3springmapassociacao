<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layoutprincipal.html}">

<head>
    <title>Manter Aluno</title>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <div class=" container" layout:fragment="conteudoprincipal">
        <div class="p-4 p-md-5 mt-4 mb-4 rounded text-body-emphasis" style="background-color: #E9F1FA;">
            <div class="col-lg-6 px-0">
                <h1 class="display-4 fst-italic">Manter Aluno</h1>
            </div>
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Nome</th>
                    <th scope="col">CPF</th>
                    <th scope="col">Data de Nascimento</th>
                    <th scope="col"></th>
                    <th scope="col"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="aluno : ${alunos}">
                    <th scope="row"><span th:text="${aluno.id}"></span></th>
                    <td><span th:text="${aluno.nome}"></span></td>
                    <td><span th:text="${aluno.cpf}"></span></td>
                    <td><span th:text="${#temporals.format(aluno.dataNascimento, 'dd/MM/yyyy')}"></span></td>
                    <td>
                        <form th:action="@{/editaraluno/{id}(id=${aluno.id})}" method="get"
                            onsubmit="return confirm('Deseja realmente editar este aluno?');">
                            <button type="submit" class="btn btn-warning">Editar</button>
                        </form>
                    </td>
                    <td>
                        <form th:action="@{/removeraluno/{id}(id=${aluno.id})}" method="get"
                            onsubmit="return confirm('Deseja realmente remover este aluno?');">
                            <button type="submit" class="btn btn-danger">Remover</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

<div class="modal fade"
     id="modalErro"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header bg-danger text-white">

                <h5 class="modal-title">
                    Erro de Exclusão
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <span th:text="${erro}"></span>

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Ok

                </button>

            </div>

        </div>

    </div>

</div>

<script th:if="${erro}">

    window.onload = function () {

        let modal = new bootstrap.Modal(
            document.getElementById('modalErro')
        );

        modal.show();
    };


</script>



<div class="modal fade"
     id="modalSucesso"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header bg-success text-white">

                <h5 class="modal-title">
                    Tudo Certo!
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <span th:text="${sucesso}"></span>

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Ok

                </button>

            </div>

        </div>

    </div>

</div>

<script th:if="${sucesso}">

    window.onload = function () {

        let modal = new bootstrap.Modal(
            document.getElementById('modalSucesso')
        );

        modal.show();
    };


</script>
    </div>

</body>

</html>
