<!doctype html>
<html
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layoutprincipal.html}"
>
  <head>
    <title>Lista de Cursos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container" layout:fragment="conteudoprincipal">
      <div
        class="p-4 p-md-5 mt-4 mb-4 rounded text-body-emphasis"
        style="background-color: #e9f1fa"
      >
        <div class="col-lg-6 px-0">
          <h1 class="display-4 fst-italic">Manter Curso</h1>
        </div>
      </div>
      <table class="table table-striped table-hover">
        <thead class="table">
          <tr>
            <th>Nome</th>
            <th>Carga Horária</th>
            <th>Editar</th>
            <th>Remover</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="curso : ${cursos}">
            <td th:text="${curso.nome}"></td>
            <td th:text="${curso.cargaHoraria}"></td>

            <td>
              <form
                th:action="@{/editarcurso/{id}(id=${curso.id})}"
                method="get"
              >
                <button type="submit" class="btn btn-warning">Editar</button>
              </form>
            </td>

            <td>
              <form
                th:action="@{/removercurso/{id}(id=${curso.id})}"
                method="get"
                onsubmit="
                  return confirm('Deseja realmente remover este curso?');
                "
              >
                <button type="submit" class="btn btn-danger">Remover</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
