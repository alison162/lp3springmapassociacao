<!doctype html>
<html
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layoutprincipal.html}"
>
  <head>
    <title>Salvar Matricula</title>
  </head>

  <body>
    <div layout:fragment="conteudoprincipal">
      <div
        class="p-4 p-md-5 mt-4 mb-4 rounded text-body-emphasis"
        style="background-color: #e9f1fa"
      >
        <div class="col-lg-6 px-0">
          <h1 class="display-4 fst-italic">Salvar Matricula</h1>
          <p class="lead my-3">Preencha os dados da matrícula.</p>
          <p class="lead mb-0">
            <a href="#" class="text-body-emphasis fw-bold"
              >Continue reading...</a
            >
          </p>
        </div>
      </div>

      <form action="/salvarmatricula" method="post" th:object="${matricula}">
        <input type="hidden" th:field="*{id}" />
        <div class="row mb-3">
        <div class="col-6">
          <label class="form-label">Aluno</label>
          <select class="form-select" name="aluno">
            <option value="">Selecione um aluno</option>
            <option
              th:each="aluno : ${alunos}"
              th:value="${aluno.id}"
              th:text="${aluno.nome}"
            ></option>
          </select>
        </div>

        <div class="col-6">
          <label class="form-label">Curso</label>
          <select class="form-select" name="curso">
            <option value="">Selecione um curso</option>
            <option
              th:each="curso : ${cursos}"
              th:value="${curso.id}"
              th:text="${curso.nome}"
            ></option>
          </select>
        </div>
        </div>
        <div class="row mb-3">
          <div class="col-6">
            <label for="dataMatricula" class="form-label"
              >Data da Matrícula</label
            >
            <input
              type="date"
              class="form-control"
              th:field="*{dataMatricula}"
            />
          </div>
          <div class="col-3">
            <label for="status" class="form-label">Status</label>
            <input
              type="text"
              id="status"
              class="form-control"
              th:field="*{status}"
            />
          </div>
        </div>
        <div class="mt-3">
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </body>
</html>
