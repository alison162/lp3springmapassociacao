<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layoutprincipal.html}">

<head>
    <title>Manter Gerente</title>
</head>

<body>
    <div class=" container" layout:fragment="conteudoprincipal">
        <div class="p-4 p-md-5 mt-4 mb-4 rounded text-body-emphasis" style="background-color: #E9F1FA">
            <div class="col-lg-6 px-0">
                <h1 class="display-4 fst-italic">Manter Gerente</h1>
            </div>
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Nome</th>
                    <th scope="col">CPF</th>
                    <th scope="col">Data de Nascimento</th>
                    <th scope="col">Data de Admissão</th>
                    <th scope="col">Nível de Acesso</th>
                    <th scope="col"></th>
                    <th scope="col"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="gerente : ${gerentes}">
                    <th scope="row"><span th:text="${gerente.id}"></span></th>
                    <td><span th:text="${gerente.nome}"></span></td>
                    <td><span th:text="${gerente.cpf}"></span></td>
                    <td th:text="${#temporals.format(gerente.dataNascimento, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(gerente.dataAdmissao, 'dd/MM/yyyy')}"></td>
                    <td><span th:text="${gerente.nivelDeAcesso}"></span></td>
                    <td>
                        <form th:action="@{/salvargerente/{id}(id=${gerente.id})}" method="get"
                            onsubmit="return confirm('Deseja realmente editar este gerente?');">
                            <button type="submit" class="btn btn-warning">Editar</button>
                        </form>
                    </td>
                    <td>
                        <form th:action="@{/removergerente/{id}(id=${gerente.id})}" method="get"
                            onsubmit="return confirm('Deseja realmente remover este gerente?');">
                            <button type="submit" class="btn btn-danger">Remover</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    </div>
</body>

</html>
