<!doctype html>
<html
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layoutprincipal.html}"
>
  <head>
    <title>Salvar Gerente</title>
  </head>

  <body>
    <div class="container" layout:fragment="conteudoprincipal">
      <div
        class="p-4 p-md-5 mt-4 mb-4 rounded text-body-emphasis"
        style="background-color: #e9f1fa"
      >
        <div class="col-lg-6 px-0">
          <h1 class="display-4 fst-italic">Salvar Gerente</h1>
          <p class="lead my-3">Preencha os dados do gerente .</p>
          <p class="lead mb-0">
            <a href="#" class="text-body-emphasis fw-bold"
              >Continue reading...</a
            >
          </p>
        </div>
      </div>

      <form action="/salvargerente" method="post" th:object="${gerente}">
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
          <span th:each="erro : ${#fields.globalErrors()}" th:text="${erro}">
          </span>
        </div>
        <input type="hidden" th:field="*{id}" />

        <div class="row mb-3">
          <div class="col-md-8">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" th:field="*{nome}" />
            <ul>
              <li
                th:each="error : ${#fields.errors('nome')}"
                th:text="${error}"
                class="text-danger"
              ></li>
            </ul>
          </div>
          <div class="col-md-4">
            <label for="cpf" class="form-label">CPF</label>
            <input
              type="text"
              class="form-control"
              th:field="*{cpf}"
              aria-describedby="cpfHelp"
            />
            <ul>
              <li
                th:each="error : ${#fields.errors('cpf')}"
                th:text="${error}"
                class="text-danger"
              ></li>
            </ul>
            <div id="cpfHelp" class="form-text">
              Nunca compartilhe seu CPF com ninguém.
            </div>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-4">
            <label for="dataNascimento" class="form-label"
              >Data de Nascimento</label
            >
            <input
              type="date"
              class="form-control"
              th:field="*{dataNascimento}"
            />
            <ul>
              <li
                th:each="error : ${#fields.errors('dataNascimento')}"
                th:text="${error}"
                class="text-danger"
              ></li>
            </ul>
          </div>
          <div class="col-md-4">
            <label for="nivelDeAcesso" class="form-label"
              >Nível de Acesso</label
            >
            <input
              type="number"
              class="form-control"
              th:field="*{nivelDeAcesso}"
              aria-describedby="nivelDeAceso"
            />
            <ul>
              <li
                th:each="error : ${#fields.errors('nivelDeAcesso')}"
                th:text="${error}"
                class="text-danger"
              ></li>
            </ul>
            <div id="nivelDeAcesso" class="form-text">
              Preencimento obrigatório.
            </div>
          </div>
          <div class="col-md-4">
            <label for="dataAdmissao" class="form-label"
              >Data de Admissão</label
            >
            <input
              type="date"
              class="form-control"
              th:field="*{dataAdmissao}"
            />
            <ul>
              <li
                th:each="error : ${#fields.errors('dataAdmissao')}"
                th:text="${error}"
                class="text-danger"
              ></li>
            </ul>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}" />
            <div
              class="text-danger"
              th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}"
            ></div>
          </div>
          <div class="col-md-6">
            <label for="status" class="form-label">Status</label>
            <select id="status" class="form-select" th:field="*{status}">
              <option value="Ativo">Ativo</option>
              <option value="Inativo">Inativo</option>
            </select>
            <div
              class="text-danger"
              th:if="${#fields.hasErrors('status')}"
              th:errors="*{status}"
            ></div>
          </div>
        </div>

        <div class="col-md-12 mt-4">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </form>
      <div class="modal fade" id="modalErro" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header bg-danger text-white">
              <h5 class="modal-title">Erro de Validação</h5>

              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <ul class="mb-0">
                <span th:each="err : ${erros}" th:text="${err.defaultMessage}">
                </span>
              </ul>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Ok
              </button>
            </div>
          </div>
        </div>
      </div>
      <script th:if="${temErro}">
        window.addEventListener("load", function () {
          const modal = new bootstrap.Modal(
            document.getElementById("modalErro"),
          );
          modal.show();
        });
      </script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </div>
  </body>
</html>
